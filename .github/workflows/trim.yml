name: CI/CD Workflow

on:
  push:
    branches:
      - testing
  workflow_dispatch:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:18.20.4

    steps:
      - uses: actions/checkout@v2

  deploy_main:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Check deployment flag
        id: check-flag
        run: |
          DEPLOY_FLAG="yes"
          if [ "$DEPLOY_FLAG" != "yes" ]; then
            echo "Skipping deployment."
            exit 0
          fi

      - name: Create .env file dynamically
        run: echo "${{ secrets.ENV_FILE_CONTENT_PROD }}" > .env

      - name: Create config folder and files
        run: |
          mkdir -p config
          echo "${{ secrets.CONFIG_JSON_CONTENT }}" > config/config.json

      - name: Create .htaccess file
        run: echo "${{ secrets.HTACCESS_CONTENT_PROD }}" > .htaccess

      - name: Creating firebase.json file
        run: echo "${{ secrets.FIREBASE_CONTENT_PROD }}" > firebase.json

      # 1. 📂 Sync Files via SSH (Manual Rsync - Most Reliable)
      - name: 📂 Sync files via SSH (Manual)
        run: |
          # Setup SSH Key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add Server to Known Hosts
          ssh-keyscan -H ${{ secrets.PROD_FTP_HOST }} >> ~/.ssh/known_hosts

          # Run Rsync (Using hardcoded username 'trimworldwide')
          echo "Starting Rsync Upload..."
          rsync -avz --delete --exclude 'node_modules' --exclude '.git' --exclude '.github' \
          -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
          ./ trimworldwide@${{ secrets.PROD_FTP_HOST }}:/home/trimworldwide/backend.trimworldwide.com/

      # 2. 🚀 Execute Remote Commands via SSH
      - name: 🚀 Execute Remote Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_FTP_HOST }}
          username: trimworldwide           # Hardcoded to ensure correct SSH user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export PATH=/home/trimworldwide/.nvm/versions/node/v18.20.4/bin:$PATH
            export HOME=/home/trimworldwide
            
            cd /home/trimworldwide/backend.trimworldwide.com

            echo "Installing dependencies..."
            npm install --production

            echo "Restarting PM2 process..."
            pm2 stop trim.js || true
            pm2 delete trim.js || true
            pm2 start trim.js
            pm2 save
            
            echo "Main Deployment Complete!"

  deploy_testing:
    needs: build
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Create .env file dynamically
        run: echo "${{ secrets.ENV_FILE_CONTENT_STAGE }}" > .env

      - name: Create config folder and files
        run: |
          mkdir -p config
          echo "${{ secrets.CONFIG_JSON_CONTENT }}" > config/config.json

      - name: Create .htaccess file
        run: echo "${{ secrets.HTACCESS_CONTENT_STAGE }}" > .htaccess

      - name: Creating firebase.json file
        run: echo "${{ secrets.FIREBASE_CONTENT_STAGE }}" > firebase.json

      # 1. 📂 Sync Files via SSH (Manual Rsync - Most Reliable)
      - name: 📂 Sync files via SSH (Manual)
        run: |
          # Setup SSH Key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add Server to Known Hosts
          ssh-keyscan -H ${{ secrets.STAGE_FTP_HOST }} >> ~/.ssh/known_hosts

          # Run Rsync (Using hardcoded username 'trimworldwide')
          echo "Starting Rsync Upload..."
          rsync -avz --delete --exclude 'node_modules' --exclude '.git' --exclude '.github' \
          -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
          ./ trimworldwide@${{ secrets.STAGE_FTP_HOST }}:/home/trimworldwide/stage.trimworldwide.com/

      # 2. 🚀 Execute Remote Commands via SSH
      - name: 🚀 Execute Remote Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGE_FTP_HOST }}
          username: trimworldwide           # Hardcoded to ensure correct SSH user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export PATH=/home/trimworldwide/.nvm/versions/node/v18.20.4/bin:$PATH
            export HOME=/home/trimworldwide
            
            cd /home/trimworldwide/stage.trimworldwide.com

            echo "Installing dependencies..."
            npm install

            echo "Restarting PM2 process..."
            pm2 stop thetrim.js || true
            pm2 delete thetrim.js || true
            pm2 start thetrim.js
            pm2 save
            
            echo "Testing Deployment Complete!"