name: CI/CD Workflow

on:
  push:
    branches:
      - testing
  workflow_dispatch:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:18.20.4

    steps:
      - uses: actions/checkout@v2

  deploy_main:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Check deployment flag
        id: check-flag
        run: |
          DEPLOY_FLAG="yes"
          if [ "$DEPLOY_FLAG" != "yes" ]; then
            echo "Skipping deployment."
            exit 0
          fi

      - name: Create .env file dynamically
        run: echo "${{ secrets.ENV_FILE_CONTENT_PROD }}" > .env

      - name: Create config folder and files
        run: |
          mkdir -p config
          echo "${{ secrets.CONFIG_JSON_CONTENT }}" > config/config.json

      - name: Create .htaccess file
        run: echo "${{ secrets.HTACCESS_CONTENT_PROD }}" > .htaccess

      - name: Creating firebase.json file
        run: echo "${{ secrets.FIREBASE_CONTENT_PROD }}" > firebase.json

      # 1. 📂 Sync Files via SSH (Rsync) - REPLACES FTP
      - name: 📂 Sync files via SSH (Rsync)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.PROD_FTP_HOST }}
          REMOTE_USER: ${{ secrets.PROD_FTP_USERNAME }}
          TARGET: "/home/trimworldwide/backend.trimworldwide.com/"
          EXCLUDE: "/node_modules/, /.git/, /.github/"

      # 2. 🚀 Execute Remote Commands via SSH
      - name: 🚀 Execute Remote Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_FTP_HOST }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=/home/trimworldwide/.nvm/versions/node/v18.20.4/bin:$PATH
            export HOME=/home/trimworldwide
            
            cd /home/trimworldwide/backend.trimworldwide.com

            echo "Installing dependencies..."
            npm install --production

            echo "Restarting PM2 process..."
            pm2 stop trim.js || true
            pm2 delete trim.js || true
            pm2 start trim.js
            pm2 save
            
            echo "Main Deployment Complete!"

  deploy_testing:
    needs: build
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Create .env file dynamically
        run: echo "${{ secrets.ENV_FILE_CONTENT_STAGE }}" > .env

      - name: Create config folder and files
        run: |
          mkdir -p config
          echo "${{ secrets.CONFIG_JSON_CONTENT }}" > config/config.json

      - name: Create .htaccess file
        run: echo "${{ secrets.HTACCESS_CONTENT_STAGE }}" > .htaccess

      - name: Creating firebase.json file
        run: echo "${{ secrets.FIREBASE_CONTENT_STAGE }}" > firebase.json

      # 1. 📂 Sync Files via SSH (Rsync) - REPLACES FTP
      - name: 📂 Sync files via SSH (Rsync)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.STAGE_FTP_HOST }}
          REMOTE_USER: ${{ secrets.STAGE_FTP_USERNAME }}
          TARGET: "/home/trimworldwide/stage.trimworldwide.com/"
          EXCLUDE: "/node_modules/, /.git/, /.github/"

      # 2. 🚀 Execute Remote Commands via SSH
      - name: 🚀 Execute Remote Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGE_FTP_HOST }}
          username: ${{ secrets.STAGE_FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=/home/trimworldwide/.nvm/versions/node/v18.20.4/bin:$PATH
            export HOME=/home/trimworldwide
            
            cd /home/trimworldwide/stage.trimworldwide.com

            echo "Installing dependencies..."
            npm install

            echo "Restarting PM2 process..."
            # I changed 'thetrim.js' to 'trim.js' to match Main. 
            # If your testing app IS named differently, change this back.
            pm2 stop thetrim.js || true
            pm2 delete thetrim.js || true
            pm2 start thetrim.js
            pm2 save
            
            echo "Testing Deployment Complete!"

