name: CI/CD Workflow

on:
  push:
    branches:
      - testing
  workflow_dispatch:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:18.20.4

    steps:
      - uses: actions/checkout@v2

  deploy_main:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Check deployment flag
        id: check-flag
        run: |
          DEPLOY_FLAG="yes"
          echo "Deployment flag is set to: $DEPLOY_FLAG"
          if [ "$DEPLOY_FLAG" != "yes" ]; then
            echo "Deployment flag is not set to 'yes'. Skipping deployment."
            exit 0
          fi

      - name: Create .env file dynamically
        run: echo "${{ secrets.ENV_FILE_CONTENT_PROD }}" > $GITHUB_WORKSPACE/.env

      - name: Create config folder and files
        run: |
          mkdir -p $GITHUB_WORKSPACE/config
          echo "${{ secrets.CONFIG_JSON_CONTENT }}" > $GITHUB_WORKSPACE/config/config.json

      - name: Create .htaccess file
        run: echo "${{ secrets.HTACCESS_CONTENT_PROD }}" > $GITHUB_WORKSPACE/.htaccess

      - name: Creating firebase.json file
        run: echo "${{ secrets.FIREBASE_CONTENT_PROD }}" > $GITHUB_WORKSPACE/firebase.json

      - name: 📂 Sync files to production
        uses: SamKirkland/FTP-Deploy-Action@v4.2.0
        with:
          local-dir: ${{ github.workspace }}
          server: ${{ secrets.PROD_FTP_HOST }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          include: |
            .env
            .htaccess
            config/config.json
            firebase.json
          debug: true

      - name: Trigger npm install on server
        run: |
          echo "Triggering npm install via PHP script..."
          curl -X GET "https://backend.trimworldwide.com/trigger.php"
        env:
          HOME: /home/trimworldwide

  deploy_testing:
    needs: build
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Create .env file dynamically
        run: echo "${{ secrets.ENV_FILE_CONTENT_STAGE }}" > $GITHUB_WORKSPACE/.env

      - name: Create config folder and files
        run: |
          mkdir -p $GITHUB_WORKSPACE/config
          echo "${{ secrets.CONFIG_JSON_CONTENT }}" > $GITHUB_WORKSPACE/config/config.json

      - name: Create .htaccess file
        run: echo "${{ secrets.HTACCESS_CONTENT_STAGE }}" > $GITHUB_WORKSPACE/.htaccess

      - name: Creating firebase.json file
        run: echo "${{ secrets.FIREBASE_CONTENT_STAGE }}" > $GITHUB_WORKSPACE/firebase.json

      - name: 📂 Sync files to development
        uses: SamKirkland/FTP-Deploy-Action@v4.2.0
        with:
          local-dir: ${{ github.workspace }}
          server: ${{ secrets.STAGE_FTP_HOST }}
          username: ${{ secrets.STAGE_FTP_USERNAME }}
          password: ${{ secrets.STAGE_FTP_PASSWORD }}
          include: |
            .env
            .htaccess
            config/config.json
            firebase.json
          debug: true

      - name: Trigger npm install on server
        run: |
          echo "Triggering npm install and pm2 start via PHP script..."
          curl -X GET "https://stage.trimworldwide.com/trigger.php"
        env:
          HOME: /home/trimworldwide